<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>UniMap UCDB · Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
html,body{height:100%;margin:0;font:15px system-ui,sans-serif}
.c{display:none;height:100%;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center}
#ad{display:none;height:100%;grid-template-columns:320px 1fr}
@media(max-width:800px){#ad{grid-template-columns:1fr;grid-template-rows:45% 55%}}
#side{overflow:auto;padding:10px;border-right:1px solid #ddd}
#map{height:100%}
.r{padding:10px 0;border-bottom:1px solid #ddd;display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
.r small{color:#667085}.r button{margin:3px 3px 0 0}.r-main{display:flex;align-items:flex-start;gap:9px}.r-copy{min-width:0;flex:1}.r-copy b{display:block}.r-copy p{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0;color:#49566a;font-size:13px}.r-photo,.r-photo-empty{width:86px;height:68px;object-fit:cover;border-radius:6px;flex:none}.r-photo-empty{display:grid;place-items:center;background:#eef2f7;color:#667085;font-size:11px}.r-status{font-weight:600}.r-status.pending{color:#9a6700}.r-status.rejected{color:#b42318}.r-status.approved{color:#18794e}
button{font:inherit;cursor:pointer}
.big{padding:12px 18px;border:0;border-radius:8px;background:#0a4da2;color:#fff}

#lg input {
  width: 260px;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font: inherit;
}
</style>
</head>
<body>
<div class="c" id="lg">
  <h2>UniMap · Área restrita</h2>
  <input id="email" type="email" placeholder="Seu e-mail" required>
  <input id="password" type="password" placeholder="Sua senha" required>
  <button class="big" id="login">Entrar</button>
  <p id="loginError" style="color:#c00"></p>
</div>
<div class="c" id="dn"><p id="deny"></p><button class="big" id="out">Sair</button></div>
<div id="ad">
  <div id="side">
    <b>Locais</b> <button id="out2">Sair</button> <button id="imp">Importar JSON</button>
    <input type="file" id="file" accept=".json" hidden>
  <p><small>Arraste os pinos para ajustar. Clique duas vezes no mapa para adicionar. Revise foto, descrição e coordenadas antes de aprovar ou rejeitar.</small></p>
    <div id="list"></div>
  </div>
  <div id="map"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script>
const sb = supabase.createClient(CFG.URL, CFG.KEY), $ = id => document.getElementById(id), {esc} = UM;
const show = id => { ['lg', 'dn', 'ad'].forEach(k => $(k).style.display = k === id ? (k === 'ad' ? 'grid' : 'flex') : 'none'); };
const logout = async () => { await sb.auth.signOut(); location.reload(); };
$('login').onclick = async () => {
  const email = $('email').value.trim();
  const password = $('password').value;

  $('loginError').textContent = '';

  const { error } = await sb.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    $('loginError').textContent = 'Erro ao entrar: ' + error.message;
    return;
  }

  location.reload();
};
$('out').onclick = logout; $('out2').onclick = logout;

let map, P = [], M = {};
async function init() {
  const {data: {session}} = await sb.auth.getSession();
  if (!session) return show('lg');
  if (!UM.isDevEmail(session.user.email, CFG.DEV_EMAIL)) { $('deny').textContent = 'A conta ' + session.user.email + ' não tem acesso.'; return show('dn'); }
  show('ad');
  map = L.map('map', {doubleClickZoom: false}).setView([-20.4065, -54.6169], 17);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap'}).addTo(map);
  map.on('dblclick', async e => {
    const name = (prompt('Nome do novo local:') || '').trim().slice(0, 80); if (!name) return;
    const {error} = await sb.from('places').insert({name, cat: 'Bloco', lat: e.latlng.lat, lng: e.latlng.lng, autor: 'dev', approved: true, rejected: false});
    if (error) alert(error.message); load();
  });
  load();
}
async function load() {
  const {data, error} = await sb.from('places').select('*').order('created_at');
  if (error) return alert(error.message);
  P = UM.sortPendingFirst(data || []);
  Object.values(M).forEach(m => m.remove()); M = {};
  P.forEach(p => {
    const status = p.approved ? 'aprovado' : (p.rejected ? 'rejeitado' : 'pendente');
    const m = L.marker([p.lat, p.lng], {draggable: true, opacity: p.approved ? 1 : .55}).addTo(map).bindTooltip(p.name + ' · ' + status);
    m.on('dragend', async () => {
      const l = m.getLatLng();
      const {error} = await sb.from('places').update({lat: l.lat, lng: l.lng}).eq('id', p.id);
      if (error) alert(error.message);
    });
    M[p.id] = m;
  });
  const cards = await Promise.all(P.map(async p => {
    let image = '<span class="r-photo-empty">Sem foto</span>';
    if (p.image_path) {
      const {data: signed, error: imageError} = await sb.storage.from('place-images').createSignedUrl(p.image_path, 3600);
      if (!imageError) image = '<img class="r-photo" src="' + esc(signed.signedUrl) + '" alt="Foto de referência de ' + esc(p.name) + '">';
      else image = '<span class="r-photo-empty">Foto indisponível</span>';
    }
    const state = p.approved ? 'approved' : (p.rejected ? 'rejected' : 'pending');
    const label = p.approved ? 'Aprovado' : (p.rejected ? 'Rejeitado' : 'Pendente');
    const reviewActions = !p.approved && !p.rejected
      ? '<button data-a="ok" data-id="' + p.id + '">Aprovar</button><button data-a="reject" data-id="' + p.id + '">Rejeitar</button>'
      : (p.rejected ? '<button data-a="reopen" data-id="' + p.id + '">Reabrir análise</button>' : '');
    const description = p.description ? '<p>' + esc(p.description) + '</p>' : '<p><small>Sem descrição.</small></p>';
    const location = Number.isFinite(Number(p.lat)) && Number.isFinite(Number(p.lng))
      ? Number(p.lat).toFixed(6) + ', ' + Number(p.lng).toFixed(6) : 'Coordenadas indisponíveis';
    return '<div class="r"><div class="r-main">' + image + '<div class="r-copy"><b>' + esc(p.name) +
      ' <small>' + esc(p.cat) + '</small></b>' + description + '<small>Localização: ' + esc(location) +
      ' · <span class="r-status ' + state + '">' + label + '</span></small></div></div><div>' +
      '<button data-f="' + p.id + '">Ver no mapa</button>' + reviewActions +
      '<button data-a="ren" data-id="' + p.id + '">Renomear</button><button data-a="del" data-id="' + p.id + '">Excluir</button></div></div>';
  }));
  $('list').innerHTML = cards.join('');
  $('list').querySelectorAll('img.r-photo').forEach(img => img.addEventListener('error', () => {
    const fallback = document.createElement('span');
    fallback.className = 'r-photo-empty';
    fallback.textContent = 'Foto indisponível';
    img.replaceWith(fallback);
  }));
}
$('list').onclick = async e => {
  const button = e.target.closest('button'); if (!button) return;
  const d = button.dataset, p = P.find(x => x.id === (d.id || d.f)); if (!p) return;
  if (d.f) { map.setView(M[p.id].getLatLng(), 19); return; }
  let res;
  if (d.a === 'ok') res = await sb.from('places').update({approved: true, rejected: false}).eq('id', p.id);
  if (d.a === 'reject') res = await sb.from('places').update({approved: false, rejected: true}).eq('id', p.id);
  if (d.a === 'reopen') res = await sb.from('places').update({approved: false, rejected: false}).eq('id', p.id);
  if (d.a === 'ren') { const n = prompt('Novo nome:', p.name); if (!n) return; res = await sb.from('places').update({name: n.slice(0, 80)}).eq('id', p.id); }
  if (d.a === 'del') { if (!confirm('Excluir "' + p.name + '"?')) return; res = await sb.from('places').delete().eq('id', p.id); }
  if (res && res.error) alert(res.error.message);
  load();
};
$('imp').onclick = () => $('file').click();
$('file').onchange = async e => {
  try {
    const {rows, skipped} = UM.buildImportRows(JSON.parse(await e.target.files[0].text()));
    let msg = '';
    if (rows.length) {
      const {error} = await sb.from('places').insert(rows);
      msg = error ? error.message : rows.length + ' locais importados.';
    } else msg = 'Nenhum local válido no arquivo.';
    if (skipped.length) msg += '\nIgnorados: ' + skipped.map(s => '#' + (s.index + 1) + ' (' + s.reason + ')').join(', ');
    alert(msg);
    load();
  } catch (x) { alert('JSON inválido.'); }
  e.target.value = '';
};
init();
</script></body></html>
